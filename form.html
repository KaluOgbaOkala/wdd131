<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by selecting a product, rating your experience, and sharing your feedback.">
    <meta name="author" content="Kalu Ogba Okala">
    <title>Product Review Form | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">

            <fieldset>
                <legend>Product Information</legend>

                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <label for="rating1">☆<span>1 Star</span></label>
                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating2">☆☆<span>2 Stars</span></label>
                    <input type="radio" id="rating2" name="rating" value="2">

                    <label for="rating3">☆☆☆<span>3 Stars</span></label>
                    <input type="radio" id="rating3" name="rating" value="3">

                    <label for="rating4">☆☆☆☆<span>4 Stars</span></label>
                    <input type="radio" id="rating4" name="rating" value="4">

                    <label for="rating5">☆☆☆☆☆<span>5 Stars</span></label>
                    <input type="radio" id="rating5" name="rating" value="5">
                </div>
            </fieldset>

            <fieldset>
                <legend>Date of Installation</legend>

                <label for="installationDate">When did you install this product?</label>
                <input type="date" id="installationDate" name="installationDate" required>
            </fieldset>

            <fieldset>
                <legend>Useful Features</legend>
                <p class="instruction">Which features did you find useful? (Check all that apply)</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <fieldset>
                <legend>Written Review</legend>

                <label for="writtenReview">Write your review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
            </fieldset>

            <fieldset>
                <legend>Your Information</legend>

                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </fieldset>

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Kalu Ogba Okala | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
